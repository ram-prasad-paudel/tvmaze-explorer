<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TVVerse</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>TVVerse</h1>
        <p class="subtitle">
          Discover TV shows, explore live data, and save your favorites
        </p>
        <p class="header-note">
          Built with JavaScript, Fetch API, localStorage and dynamic DOM rendering
        </p>
      </div>
    </header>

    <main class="container">
      <section class="search-section">
        <form id="searchForm" class="search-form">
          <label for="searchInput" class="sr-only">Search for a TV show</label>

          <input
            type="text"
            id="searchInput"
            name="searchInput"
            placeholder="Search for a TV show..."
            autocomplete="off"
          />

          <button type="submit">Search</button>
          <button type="button" id="clearButton" class="clear-btn">Clear</button>
        </form>
      </section>

      <section class="genre-section">
        <h2 class="section-title">Quick Picks</h2>
        <div class="genre-buttons">
          <button class="genre-btn" data-query="drama">Drama</button>
          <button class="genre-btn" data-query="comedy">Comedy</button>
          <button class="genre-btn" data-query="thriller">Thriller</button>
          <button class="genre-btn" data-query="anime">Anime</button>
          <button class="genre-btn" data-query="crime">Crime</button>
          <button class="genre-btn" data-query="romance">Romance</button>
        </div>
      </section>

      <section class="status-section">
        <div id="statusMessage" class="status-message" aria-live="polite"></div>
        <div id="loader" class="loader hidden" aria-hidden="true"></div>
      </section>

      <section id="featuredSection" class="featured-section hidden">
        <h2 class="section-title">Featured Show</h2>
        <div id="featuredCard" class="featured-card"></div>
      </section>

      <section class="favorites-section">
        <div class="favorites-header">
          <h2 class="section-title">My Favorites</h2>
          <button type="button" id="clearFavoritesButton" class="small-btn">
            Clear Favorites
          </button>
        </div>
        <div id="favoritesContainer" class="favorites-grid"></div>
      </section>

      <section>
        <h2 class="section-title">Search Results</h2>
        <section id="results" class="results-grid" aria-live="polite"></section>
      </section>
    </main>

    <footer class="site-footer">
      <p>TVVerse © 2026 | Built for AJAX Enabled Applications Project</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
